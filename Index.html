      <h1 class="font-serif text-2xl text-sage-700 sm:text-3xl">Teilt eure Fotos mit uns</h1>
      <p class="mx-auto mt-2 max-w-md text-sm text-stone-600 sm:text-base">
        Ladet eure Bilder von der Feier hoch – sie landen direkt in unserem
        gemeinsamen Hochzeitsalbum.
      </p>
    </div>

    <div class="mt-8 w-full">
      <div id="dropzone"
        class="cursor-pointer touch-manipulation rounded-2xl border-2 border-dashed border-sage-300 bg-white/60 p-6 text-center transition active:scale-[0.98] active:border-sage-500 active:bg-sage-100 sm:p-10 sm:hover:bg-white">
        <input id="fileInput" type="file"
          accept="image/*" multiple class="hidden">
        <p class="font-serif text-base text-sage-700 sm:text-lg">Antippen zum Auswählen</p>
        <p class="mt-1 text-xs text-stone-500 sm:text-sm">Alle gängigen Foto-Formate (JPG, HEIC, PNG, WEBP, GIF, DNG …) · max. 50 MB pro Bild</p>
      </div>

      <div id="previewGrid" class="mt-6 grid grid-cols-3 gap-2 sm:gap-3"></div>

      <div class="mt-6 flex flex-col items-center gap-3">
        <button id="uploadBtn" type="button" aria-disabled="true"
          class="hidden w-full touch-manipulation cursor-not-allowed rounded-full bg-stone-300 px-8 py-3.5 text-base font-medium text-white shadow-md transition-colors">
          Hochladen
        </button>

        <div id="progressWrap" class="hidden w-full">
          <div class="h-2 w-full overflow-hidden rounded-full bg-sage-100">
            <div id="progressBar" class="progress-stripes h-full w-0 rounded-full bg-sage-500 transition-[width] duration-300"></div>
          </div>
          <p id="progressLabel" class="mt-1.5 text-center text-xs text-stone-500"></p>
        </div>

        <ul id="statusList" class="w-full space-y-1 text-sm"></ul>
      </div>
    </div>

    <svg viewBox="0 0 700 90" preserveAspectRatio="none" class="-mx-4 mt-6 h-16 w-[calc(100%+2rem)] sm:-mx-6 sm:h-20 sm:w-[calc(100%+3rem)]" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

  </main>

  <script>
    // Filled in by Code.gs (doGet) via an Apps Script template scriptlet, so
    // the page always POSTs to its own current deployment URL.
    var SCRIPT_URL = "<?!= scriptUrl ?>";

    var MAX_FILE_SIZE_MB = 50;
    // Covers standard formats plus the Apple (HEIC/HEIF, incl. Live Photo
    // "sequence" variants) and Android (JPG mislabelled as image/jpg on some
    // older devices) formats guests are likely to share photos in.
    var ACCEPTED_TYPES = [
      'image/jpeg', 'image/jpg', 'image/png', 'image/webp', 'image/gif',
      'image/heic', 'image/heif', 'image/heic-sequence', 'image/heif-sequence',
      'image/x-adobe-dng'
    ];
    // Fallback by file extension for browsers/devices that report an empty
    // or unrecognized MIME type (this happens with HEIC on some Android
    // WebViews, and is common for DNG RAW photos which browsers often don't
    // recognize at all). Maps to the canonical type sent to the server.
    var EXTENSION_MIME_MAP = {
      jpg: 'image/jpeg', jpeg: 'image/jpeg',
      png: 'image/png',
      webp: 'image/webp',
      gif: 'image/gif',
      heic: 'image/heic', heif: 'image/heif',
      dng: 'image/x-adobe-dng'
    };
    var UPLOAD_TIMEOUT_MS = 60000;
    var UPLOAD_MAX_RETRIES = 2;
    // Sequential on purpose: concurrent raw-binary POSTs to the same Apps
    // Script deployment's doPost have been observed to intermittently arrive
    // with an empty body ("Keine Daten empfangen") - likely Apps Script's
    // infrastructure not handling truly simultaneous binary uploads to one
    // web app well. One at a time is slower but reliable.
    var UPLOAD_CONCURRENCY = 1;

    // Resolves the effective MIME type for a File, falling back to the file
    // extension when the browser didn't supply (or misreported) file.type.
    // Returns null if the file isn't a recognized photo format.
    function resolveMimeType(file) {
      if (ACCEPTED_TYPES.indexOf(file.type) !== -1) return file.type;
      var ext = (file.name.split('.').pop() || '').toLowerCase();
      return EXTENSION_MIME_MAP[ext] || null;
    }

    var dropzone = document.getElementById('dropzone');
    var fileInput = document.getElementById('fileInput');
    var previewGrid = document.getElementById('previewGrid');
    var uploadBtn = document.getElementById('uploadBtn');
    var statusList = document.getElementById('statusList');
    var progressWrap = document.getElementById('progressWrap');
    var progressBar = document.getElementById('progressBar');
    var progressLabel = document.getElementById('progressLabel');

    var selectedFiles = [];
    var isUploading = false;

    // The button is intentionally never given the native "disabled" attribute:
    // some mobile browsers fail to re-enable pointer/tap handling reliably
    // after toggling .disabled via script. Instead we gate the action in
    // uploadAll() itself and only use classes for the visual state.
    function setUploadButtonEnabled(enabled) {
      uploadBtn.setAttribute('aria-disabled', enabled ? 'false' : 'true');
      if (enabled) {
        uploadBtn.classList.remove('bg-stone-300', 'cursor-not-allowed');
        uploadBtn.classList.add('bg-sage-500', 'active:bg-sage-600', 'sm:hover:bg-sage-600');
      } else {
        uploadBtn.classList.add('bg-stone-300', 'cursor-not-allowed');
        uploadBtn.classList.remove('bg-sage-500', 'active:bg-sage-600', 'sm:hover:bg-sage-600');
      }
    }

    // Only show the upload button once there is something to upload.
    function updateUploadButton() {
      var hasFiles = selectedFiles.length > 0;
      uploadBtn.classList.toggle('hidden', !hasFiles);
      setUploadButtonEnabled(hasFiles && !isUploading);
    }

    dropzone.addEventListener('click', function () { fileInput.click(); });
    dropzone.addEventListener('dragover', function (e) {
      e.preventDefault();
      dropzone.classList.add('border-sage-500', 'bg-sage-100');
    });
    dropzone.addEventListener('dragleave', function () {
      dropzone.classList.remove('border-sage-500', 'bg-sage-100');
    });
    dropzone.addEventListener('drop', function (e) {
      e.preventDefault();
      dropzone.classList.remove('border-sage-500', 'bg-sage-100');
      addFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', function (e) { addFiles(e.target.files); });

    function addStatusMessage(text, isError) {
      var li = document.createElement('li');
      li.className = isError ? 'text-red-600' : 'text-stone-500';
      li.textContent = (isError ? '✗ ' : '') + text;
      statusList.appendChild(li);
    }

    function addFiles(fileList) {
      statusList.innerHTML = '';
      var existingKeys = {};
      selectedFiles.forEach(function (f) { existingKeys[f.name + '-' + f.size] = true; });

      Array.prototype.forEach.call(fileList, function (file) {
        var key = file.name + '-' + file.size;
        if (existingKeys[key]) return;

        var mimeType = resolveMimeType(file);
        if (!mimeType) {
          addStatusMessage(file.name + ': nicht unterstütztes Dateiformat.', true);
          return;
        }
        if (file.size > MAX_FILE_SIZE_MB * 1024 * 1024) {
          addStatusMessage(file.name + ': Datei ist größer als ' + MAX_FILE_SIZE_MB + ' MB.', true);
          return;
        }

        // Stash the resolved type on the File itself so uploadOne() sends the
        // canonical MIME type even when the browser reported none.
        file.resolvedType = mimeType;
        existingKeys[key] = true;
        selectedFiles.push(file);
      });

      renderPreviews();
      fileInput.value = '';
    }

    function renderPreviews() {
      previewGrid.innerHTML = '';
      selectedFiles.forEach(function (file, index) {
        var url = URL.createObjectURL(file);
        var cell = document.createElement('div');
        cell.className = 'relative aspect-square overflow-hidden rounded-xl border border-sage-200 bg-white shadow-sm';
        cell.innerHTML =
          '<img src="' + url + '" class="h-full w-full object-cover" alt="">' +
          '<button type="button" data-index="' + index + '" aria-label="Bild entfernen" ' +
          'class="remove-btn absolute right-1 top-1 flex h-8 w-8 touch-manipulation items-center justify-center rounded-full bg-black/60 text-sm text-white">✕</button>';
        previewGrid.appendChild(cell);
      });

      Array.prototype.forEach.call(previewGrid.querySelectorAll('.remove-btn'), function (btn) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          selectedFiles.splice(Number(btn.dataset.index), 1);
          renderPreviews();
        });
      });

      uploadBtn.textContent = 'Hochladen' + (selectedFiles.length ? ' (' + selectedFiles.length + ')' : '');
      updateUploadButton();
    }

    // Uploads the raw file bytes directly via XHR POST to this web app's own
    // URL (doPost in Code.gs) instead of base64-encoding through
    // google.script.run - avoids the ~33% base64 size overhead.
    //
    // Note: this deliberately does NOT attach an xhr.upload.onprogress
    // listener. Per the CORS spec, registering any listener on
    // XMLHttpRequestUpload forces the browser to send a preflight OPTIONS
    // request, and Apps Script web apps have no way to answer that (no
    // doOptions hook) - every upload would fail with a generic network
    // error. Real byte-level progress isn't available here as a result; the
    // striped progress bar + per-row spinners are what make progress feel
    // alive instead.
    function uploadOne(file) {
      return new Promise(function (resolve, reject) {
        var mimeType = file.resolvedType || file.type;
        var url = SCRIPT_URL
          + '?fileName=' + encodeURIComponent(file.name)
          + '&mimeType=' + encodeURIComponent(mimeType);

        var xhr = new XMLHttpRequest();
        xhr.open('POST', url, true);
        xhr.timeout = UPLOAD_TIMEOUT_MS;
        // Also keeps this a CORS "simple request" (one less reason to need
        // a preflight Apps Script can't answer) - the real image MIME type
        // is passed separately via the mimeType query parameter above, so
        // the raw bytes sent here don't depend on this header at all.
        xhr.setRequestHeader('Content-Type', 'text/plain;charset=utf-8');

        xhr.onload = function () {
          var data = null;
          try { data = JSON.parse(xhr.responseText); } catch (parseErr) { /* fall through */ }

          if (xhr.status >= 200 && xhr.status < 300 && data && !data.error) {
            resolve(data);
          } else {
            reject(new Error((data && data.error) || ('Serverfehler (HTTP ' + xhr.status + ')')));
          }
        };
        xhr.onerror = function () { reject(new Error('Netzwerkfehler.')); };
        xhr.ontimeout = function () { reject(new Error('Zeitüberschreitung – bitte erneut versuchen.')); };

        xhr.send(file);
      });
    }

    function delay(ms) {
      return new Promise(function (resolve) { setTimeout(resolve, ms); });
    }

    // Retries a failed/timed-out upload a couple of times before giving up -
    // most upload failures on venue wifi/cellular are transient blips, not
    // permanent errors.
    function uploadOneWithRetry(file, attemptsLeft) {
      if (attemptsLeft === undefined) attemptsLeft = UPLOAD_MAX_RETRIES;
      return uploadOne(file).catch(function (err) {
        if (attemptsLeft <= 0) throw err;
        return delay(1000).then(function () {
          return uploadOneWithRetry(file, attemptsLeft - 1);
        });
      });
    }

    // Apps Script gives us no real byte-level transfer progress here - this
    // tracks how many of the selected photos have finished (success or
    // error) so far, which is the most accurate progress we can show.
    function updateProgress(done, total) {
      var percent = total > 0 ? Math.round((done / total) * 100) : 0;
      progressBar.style.width = percent + '%';
      progressLabel.textContent = done + ' von ' + total + ' hochgeladen (' + percent + ' %)';
    }

    async function uploadAll() {
      if (isUploading || selectedFiles.length === 0) return;

      isUploading = true;
      setUploadButtonEnabled(false);
      uploadBtn.textContent = 'Wird hochgeladen …';
      statusList.innerHTML = '';

      var files = selectedFiles.slice();
      var total = files.length;
      var done = 0;
      progressWrap.classList.remove('hidden');
      updateProgress(0, total);

      // Pre-create one status row per file (in selection order) so rows stay
      // in place no matter which upload finishes first when running in
      // parallel below.
      var rows = files.map(function (file) {
        var li = document.createElement('li');
        li.className = 'flex items-center gap-2 text-stone-500';
        var spinner = document.createElement('span');
        spinner.className = 'spinner shrink-0';
        var label = document.createElement('span');
        label.textContent = file.name + ' wird hochgeladen …';
        li.appendChild(spinner);
        li.appendChild(label);
        statusList.appendChild(li);
        return li;
      });

      var remaining = [];
      var nextIndex = 0;

      async function worker() {
        while (nextIndex < files.length) {
          var i = nextIndex++;
          var file = files[i];
          var li = rows[i];

          try {
            await uploadOneWithRetry(file);
            li.className = 'text-sage-600';
            li.textContent = '✓ ' + file.name + ' erfolgreich hochgeladen';
          } catch (err) {
            li.className = 'text-red-600';
            li.textContent = '✗ ' + file.name + ': ' + (err && err.message ? err.message : 'Fehler beim Hochladen');
            remaining.push(file);
          }

          done++;
          updateProgress(done, total);
        }
      }

      var workerCount = Math.min(UPLOAD_CONCURRENCY, files.length);
      var workers = [];
      for (var w = 0; w < workerCount; w++) workers.push(worker());
      await Promise.all(workers);

      progressWrap.classList.add('hidden');
      selectedFiles = remaining;
      isUploading = false;
      renderPreviews();
    }

    uploadBtn.addEventListener('click', uploadAll);
  </script>
</body>
</html>
