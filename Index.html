<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Georgia', 'Cambria', 'Times New Roman', 'Times', 'serif']
          },
          colors: {
            sage: {
              50: '#f4f6f3', 100: '#e5eae1', 200: '#c9d4c1', 300: '#a6b89a',
              400: '#849a75', 500: '#697f5b', 600: '#516347', 700: '#3f4d38'
            }
          }
        }
      }
    };
  </script>
  <style>
    html { scroll-behavior: smooth; }
    body { background: linear-gradient(to bottom, #f4f6f3, #ffffff, #f5f5f4); }
  </style>
</head>
<body class="min-h-screen text-stone-800">
  <main class="mx-auto flex min-h-screen w-full max-w-2xl flex-col justify-center px-4 py-10 sm:px-6 sm:py-16">
    <div class="text-center">
      <h1 class="font-serif text-2xl text-sage-700 sm:text-3xl">Teilt eure Fotos mit uns</h1>
      <p class="mx-auto mt-2 max-w-md text-sm text-stone-600 sm:text-base">
        Ladet eure Bilder von der Feier hoch – sie landen direkt in unserem
        gemeinsamen Hochzeitsalbum.
      </p>
    </div>

    <div class="mt-8 w-full">
      <div id="dropzone"
        class="cursor-pointer touch-manipulation rounded-2xl border-2 border-dashed border-sage-300 bg-white/60 p-6 text-center transition-colors active:bg-white sm:p-10 sm:hover:bg-white">
        <input id="fileInput" type="file"
          accept="image/jpeg,image/png,image/webp,image/heic,image/heif" multiple class="hidden">
        <p class="font-serif text-base text-sage-700 sm:text-lg">Fotos hierher ziehen oder antippen zum Auswählen</p>
        <p class="mt-1 text-xs text-stone-500 sm:text-sm">JPG, PNG, WEBP oder HEIC · max. 10 MB pro Bild</p>
      </div>

      <div id="previewGrid" class="mt-6 grid grid-cols-3 gap-2 sm:gap-3"></div>

      <div class="mt-6 flex flex-col items-center gap-3">
        <button id="uploadBtn" type="button" aria-disabled="true"
          class="w-full touch-manipulation cursor-not-allowed rounded-full bg-stone-300 px-8 py-3.5 text-base font-medium text-white shadow-md transition-colors">
          Hochladen
        </button>
        <ul id="statusList" class="w-full space-y-1 text-sm"></ul>
      </div>
    </div>

    <p class="mt-10 text-center text-xs text-stone-400">
      Mit Liebe gemacht für unseren schönsten Tag.
    </p>
  </main>

  <script>
    var MAX_FILE_SIZE_MB = 10;
    var ACCEPTED_TYPES = ['image/jpeg', 'image/png', 'image/webp', 'image/heic', 'image/heif'];
    var UPLOAD_TIMEOUT_MS = 30000;

    var dropzone = document.getElementById('dropzone');
    var fileInput = document.getElementById('fileInput');
    var previewGrid = document.getElementById('previewGrid');
    var uploadBtn = document.getElementById('uploadBtn');
    var statusList = document.getElementById('statusList');

    var selectedFiles = [];
    var isUploading = false;

    // The button is intentionally never given the native "disabled" attribute:
    // some mobile browsers fail to re-enable pointer/tap handling reliably
    // after toggling .disabled via script. Instead we gate the action in
    // uploadAll() itself and only use classes for the visual state.
    function setUploadButtonEnabled(enabled) {
      uploadBtn.setAttribute('aria-disabled', enabled ? 'false' : 'true');
      if (enabled) {
        uploadBtn.classList.remove('bg-stone-300', 'cursor-not-allowed');
        uploadBtn.classList.add('bg-sage-500', 'active:bg-sage-600', 'sm:hover:bg-sage-600');
      } else {
        uploadBtn.classList.add('bg-stone-300', 'cursor-not-allowed');
        uploadBtn.classList.remove('bg-sage-500', 'active:bg-sage-600', 'sm:hover:bg-sage-600');
      }
    }

    dropzone.addEventListener('click', function () { fileInput.click(); });
    dropzone.addEventListener('dragover', function (e) {
      e.preventDefault();
      dropzone.classList.add('border-sage-500', 'bg-sage-100');
    });
    dropzone.addEventListener('dragleave', function () {
      dropzone.classList.remove('border-sage-500', 'bg-sage-100');
    });
    dropzone.addEventListener('drop', function (e) {
      e.preventDefault();
      dropzone.classList.remove('border-sage-500', 'bg-sage-100');
      addFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', function (e) { addFiles(e.target.files); });

    function addFiles(fileList) {
      statusList.innerHTML = '';
      var existingKeys = {};
      selectedFiles.forEach(function (f) { existingKeys[f.name + '-' + f.size] = true; });

      Array.prototype.forEach.call(fileList, function (file) {
        if (ACCEPTED_TYPES.indexOf(file.type) === -1) return;
        if (file.size > MAX_FILE_SIZE_MB * 1024 * 1024) return;
        var key = file.name + '-' + file.size;
        if (existingKeys[key]) return;
        existingKeys[key] = true;
        selectedFiles.push(file);
      });

      renderPreviews();
      fileInput.value = '';
    }

    function renderPreviews() {
      previewGrid.innerHTML = '';
      selectedFiles.forEach(function (file, index) {
        var url = URL.createObjectURL(file);
        var cell = document.createElement('div');
        cell.className = 'relative aspect-square overflow-hidden rounded-xl border border-sage-200 bg-white shadow-sm';
        cell.innerHTML =
          '<img src="' + url + '" class="h-full w-full object-cover" alt="">' +
          '<button type="button" data-index="' + index + '" aria-label="Bild entfernen" ' +
          'class="remove-btn absolute right-1 top-1 flex h-8 w-8 touch-manipulation items-center justify-center rounded-full bg-black/60 text-sm text-white">✕</button>';
        previewGrid.appendChild(cell);
      });

      Array.prototype.forEach.call(previewGrid.querySelectorAll('.remove-btn'), function (btn) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          selectedFiles.splice(Number(btn.dataset.index), 1);
          renderPreviews();
        });
      });

      uploadBtn.textContent = 'Hochladen' + (selectedFiles.length ? ' (' + selectedFiles.length + ')' : '');
      setUploadButtonEnabled(selectedFiles.length > 0 && !isUploading);
    }

    function fileToBase64(file) {
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onload = function () { resolve(reader.result.split(',')[1]); };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function withTimeout(promise, ms) {
      return new Promise(function (resolve, reject) {
        var timer = setTimeout(function () {
          reject(new Error('Zeitüberschreitung – bitte erneut versuchen.'));
        }, ms);
        promise.then(
          function (value) { clearTimeout(timer); resolve(value); },
          function (error) { clearTimeout(timer); reject(error); }
        );
      });
    }

    function uploadOne(file) {
      var call = fileToBase64(file).then(function (base64) {
        return new Promise(function (resolve, reject) {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)
            .uploadFile(base64, file.name, file.type);
        });
      });
      return withTimeout(call, UPLOAD_TIMEOUT_MS);
    }

    async function uploadAll() {
      if (isUploading || selectedFiles.length === 0) return;

      isUploading = true;
      setUploadButtonEnabled(false);
      uploadBtn.textContent = 'Wird hochgeladen …';
      statusList.innerHTML = '';

      var remaining = [];

      for (var i = 0; i < selectedFiles.length; i++) {
        var file = selectedFiles[i];
        var li = document.createElement('li');
        li.className = 'text-stone-500';
        li.textContent = file.name + ' wird hochgeladen …';
        statusList.appendChild(li);

        try {
          await uploadOne(file);
          li.className = 'text-sage-600';
          li.textContent = '✓ ' + file.name + ' erfolgreich hochgeladen';
        } catch (err) {
          li.className = 'text-red-600';
          li.textContent = '✗ ' + file.name + ': ' + (err && err.message ? err.message : 'Fehler beim Hochladen');
          remaining.push(file);
        }
      }

      selectedFiles = remaining;
      isUploading = false;
      renderPreviews();
    }

    uploadBtn.addEventListener('click', uploadAll);
  </script>
</body>
</html>
